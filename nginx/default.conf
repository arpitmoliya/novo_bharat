# Single entry point for the frontend. Routes:
#   /        -> public website (web)
#   /admin   -> admin panel (Next.js basePath /admin)
#
# The two apps stay as separate containers; nginx unifies them onto one origin.

upstream web_app {
  server web:3000;
}

upstream admin_app {
  server admin:3000;
}

server {
  listen 80;
  server_name _;

  # Don't reject large uploads / cookies.
  client_max_body_size 25m;

  # Admin panel — basePath is /admin, so the prefix is preserved upstream.
  location /admin {
    proxy_pass http://admin_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Public website (everything else).
  location / {
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
